<div class="change-password-container">
    <div class="change-password-card">
        <div class="header">
            <h2>Change Password</h2>
            <p>Update your account password</p>
        </div>
        
        <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>Current Password</label>
                <div class="password-wrapper">
                    <input [type]="showCurrentPassword ? 'text' : 'password'" 
                           formControlName="currentPassword"
                           placeholder="Enter current password">
                    <button type="button" (click)="toggleCurrentPassword()" 
                            title="Toggle password visibility">
                        <i [class]="showCurrentPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input [type]="showNewPassword ? 'text' : 'password'" 
                           formControlName="newPassword"
                           minlength="12"
                           maxlength="128"
                           placeholder="Minimum 12 characters">
                    <button type="button" (click)="toggleNewPassword()" 
                            title="Toggle password visibility">
                        <i [class]="showNewPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <small>Must include uppercase, lowercase, number, and special character</small>
                <div class="error" *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched">
                    Enter 12 to 128 characters with uppercase, lowercase, a number and a special character.
                </div>
            </div>
            
            <div class="form-group">
                <label>Confirm New Password</label>
                <div class="password-wrapper">
                    <input [type]="showConfirmPassword ? 'text' : 'password'" 
                           formControlName="confirmNewPassword"
                           placeholder="Confirm new password">
                    <button type="button" (click)="toggleConfirmPassword()" 
                            title="Toggle password visibility">
                        <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <div class="error" *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmNewPassword')?.touched">
                    Passwords do not match
                </div>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="goBack()">Cancel</button>
                <button type="submit" class="btn-primary" [disabled]="passwordForm.invalid || isLoading">
                    <i class="fas fa-spinner fa-spin" *ngIf="isLoading"></i>
                    <span *ngIf="!isLoading">Update Password</span>
                </button>
            </div>
        </form>
    </div>
</div>
