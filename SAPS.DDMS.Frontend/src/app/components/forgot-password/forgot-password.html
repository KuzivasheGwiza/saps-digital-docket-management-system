<div class="auth-container">
  <main class="auth-card" aria-labelledby="forgot-title">
    <header class="auth-header">
      <img src="/saps-badge.svg" alt="South African Police Service badge" class="auth-logo">
      <h1 id="forgot-title">Forgot password</h1>
      <p>Enter the email address linked to your account to receive a one-time PIN</p>
    </header>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="forgot-email">Email address</label>
        <input
          id="forgot-email"
          type="email"
          maxlength="100"
          formControlName="email"
          autocomplete="email"
          placeholder="Enter your email address"
          [class.is-invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
          [attr.aria-invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
          aria-describedby="forgot-email-error">
        <div
          id="forgot-email-error"
          class="invalid-feedback"
          *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          A valid email address is required.
        </div>
      </div>

      <div class="success-message" *ngIf="message" role="status">{{ message }}</div>
      <div class="error-message" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="forgotForm.invalid || isLoading">
        <span class="button-spinner" *ngIf="isLoading" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Sending...' : 'Send one-time PIN' }}</span>
      </button>

      <a class="back-link" routerLink="/login">Back to login</a>
    </form>
  </main>
</div>
