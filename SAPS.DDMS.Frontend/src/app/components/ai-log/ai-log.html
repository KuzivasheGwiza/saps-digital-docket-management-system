<div class="log-page">
  <div class="page-header">
    <h2>AI Interaction Log</h2>
  </div>
  <div class="error-state" *ngIf="errorMessage" role="alert">
    <p>{{ errorMessage }}</p>
    <button type="button" (click)="loadLogs()">Try again</button>
  </div>
  <div class="log-table-wrap" *ngIf="!isLoading" tabindex="0" role="region" aria-label="AI interaction records">
  <table class="data-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Docket</th>
        <th>Action</th>
        <th>User</th>
        <th>Payload</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logs">
        <td>{{ log.timestamp | date:'yyyy-MM-dd HH:mm' }}</td>
        <td>{{ log.docketNumber || log.fk_DocketID }}</td>
        <td>{{ log.actionType }}</td>
        <td>{{ log.performedByUserID }}</td>
        <td><pre>{{ log.payload }}</pre></td>
      </tr>
      <tr *ngIf="logs.length === 0 && !errorMessage">
        <td colspan="5" class="no-data">No AI interaction records found.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
