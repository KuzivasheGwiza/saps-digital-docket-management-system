services:
  api:
    build:
      context: .
      dockerfile: SAPS.DDMS.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DDMS_CONNECTION_STRING}
      JwtSettings__SecretKey: ${DDMS_JWT_SECRET}
      JwtSettings__Issuer: ${DDMS_JWT_ISSUER:-SAPS-DDMS-API}
      JwtSettings__Audience: ${DDMS_JWT_AUDIENCE:-SAPS-DDMS-Frontend}
      AppUrl: ${DDMS_APP_URL}
      Cors__AllowedOrigins__0: ${DDMS_APP_URL}
      SmtpSettings__Host: ${DDMS_SMTP_HOST}
      SmtpSettings__Port: ${DDMS_SMTP_PORT:-587}
      SmtpSettings__EnableSsl: ${DDMS_SMTP_ENABLE_SSL:-true}
      SmtpSettings__Username: ${DDMS_SMTP_USERNAME}
      SmtpSettings__Password: ${DDMS_SMTP_PASSWORD}
      SmtpSettings__FromEmail: ${DDMS_SMTP_FROM}
      SmsGateway__Mode: ${DDMS_SMS_MODE:-LocalQueue}
      SmsGateway__ApiUrl: ${DDMS_SMS_API_URL:-}
      SmsGateway__ApiKey: ${DDMS_SMS_API_KEY:-}
      SmsGateway__SenderId: ${DDMS_SMS_SENDER_ID:-SAPS-DDMS}
    volumes:
      - ddms_uploads:/app/wwwroot/uploads
      - ddms_backups:/app/wwwroot/backups
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: SAPS.DDMS.Frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  ddms_uploads:
  ddms_backups:
